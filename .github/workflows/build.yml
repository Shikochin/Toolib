name: Build Release APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy 在构建时要用与 app 相同版本的 Python 跑 pip（yt-dlp）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 公开 SDK 仓库里 API 37 的包名是 platforms;android-37.0（没有裸的 android-37，
      # 直接写 platforms;android-37 会让 sdkmanager 报错、整个 job 挂在这一步）
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 用仓库 secret 里的 base64 keystore 还原签名文件；没配 secret 时打不签名的包
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 未配置，本次产物将不签名"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/toolib.jks"
          echo "keystore: $(wc -c < "$RUNNER_TEMP/keystore/toolib.jks") bytes"

      - name: Read version info
        id: version
        run: |
          CODE=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          SHORT=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "artifact=Toolib-$SHORT-$CODE" >> "$GITHUB_OUTPUT"

      - name: Build release APK (R8, minified)
        env:
          TOOLIB_KEYSTORE_PATH: ${{ runner.temp }}/keystore/toolib.jks
          TOOLIB_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TOOLIB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TOOLIB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::没有找到 release APK"; exit 1; fi
          cp "$APK" "${{ steps.version.outputs.artifact }}.apk"
          ls -l "${{ steps.version.outputs.artifact }}.apk"
          echo "signed: $(apksigner verify --print-certs "${{ steps.version.outputs.artifact }}.apk" 2>&1 | head -3 || echo 'unsigned')"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: ${{ steps.version.outputs.artifact }}.apk
          archive: false
          if-no-files-found: error
