name: Build Release APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # versionCode 由 git commit 数生成，必须拿全历史
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy 在构建时要用与 app 相同版本的 Python 跑 pip（yt-dlp）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 公开 SDK 仓库里 API 37 的包名是 platforms;android-37.0（没有裸的 android-37，
      # 直接写 platforms;android-37 会让 sdkmanager 报错、整个 job 挂在这一步）
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 用仓库 secret 里的 base64 keystore 还原签名文件；没配 secret 时打不签名的包
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 未配置，本次产物将不签名"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/toolib.jks"
          echo "keystore: $(wc -c < "$RUNNER_TEMP/keystore/toolib.jks") bytes"

      - name: Read commit info
        id: version
        run: |
          SHORT=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "commits=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build release APK (R8, minified)
        env:
          TOOLIB_KEYSTORE_PATH: ${{ runner.temp }}/keystore/toolib.jks
          TOOLIB_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TOOLIB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TOOLIB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        id: collect
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::没有找到 release APK"; exit 1; fi
          # versionCode 现在是构建时算出来的，直接从产物里读
          AAPT2="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          [ -x "$AAPT2" ] || AAPT2=$(command -v aapt2)
          CODE=$("$AAPT2" dump badging "$APK" | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p" | head -1)
          NAME="Toolib-${{ steps.version.outputs.short }}-$CODE"
          cp "$APK" "$NAME.apk"
          echo "artifact=$NAME" >> "$GITHUB_OUTPUT"
          ls -l "$NAME.apk"
          echo "signed: $(apksigner verify --print-certs "$NAME.apk" 2>&1 | head -3 || echo 'unsigned')"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.collect.outputs.artifact }}
          path: ${{ steps.collect.outputs.artifact }}.apk
          archive: false
          if-no-files-found: error
